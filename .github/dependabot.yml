version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/*-example"
      - "/java-extension-example/*"
      - "/tests"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      jruby:
        patterns:
          - "org.jruby:jruby"
      asciidoctorj-pdf:
        patterns:
          - "org.asciidoctor:asciidoctorj-pdf"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
    ignore:
      - dependency-name: "com.googlecode.maven-download-plugin:download-maven-plugin"
      - dependency-name: "org.jruby:jruby"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"